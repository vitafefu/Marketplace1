{% extends "base.html" %}
{% load static %}

{% block title %}Редактировать товар - Call of Style{% endblock %}

{% block content %}
<div class="add-product-page">
  <h1>Редактировать товар</h1>

  <form method="POST" enctype="multipart/form-data" class="product-form">
    {% csrf_token %}

    <div class="form-section">
      <h3>Изображения (можно добавить ещё)</h3>
      <div class="form-group">
        <input type="file" name="images" multiple accept="image/*">
      </div>
    </div>

    <div class="form-section">
      <h3>Основная информация</h3>

      <div class="form-group">
        <label>Название *</label>
        <input type="text" name="title" required value="{{ product.title }}">
      </div>

      <div class="form-group">
        <label>Описание *</label>
        <textarea name="description" required rows="4">{{ product.description }}</textarea>
      </div>

      <div class="form-group">
        <label>Категория *</label>
        <select name="category" required>
          {% for c in categories %}
            <option value="{{ c.id }}" {% if c.id == product.category_id %}selected{% endif %}>
              {{ c.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Бренд</label>
        <input type="text" name="brand" value="{{ product.brand }}">
      </div>
    </div>

    <button type="submit" class="btn-primary">💾 Сохранить</button>
    <a href="{% url 'product_detail' product.id %}" class="btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
